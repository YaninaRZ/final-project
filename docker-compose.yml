services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: myapp-php
    container_name: app
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: ${APP_URL:-http://localhost:8080}
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: web
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html
    depends_on:
      - app
    networks: [appnet]

  mysql:
    image: mysql:8.0
    container_name: app-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - '3306:3306'
    volumes:
      - dbdata:/var/lib/mysql
    command: ['--default-authentication-plugin=mysql_native_password']
    networks: [appnet]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 3s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: pma
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: app
      PMA_PASSWORD: secret
    ports:
      - '8081:80'
    depends_on:
      - mysql
    networks: [appnet]

volumes:
  dbdata:

networks:
  appnet:
